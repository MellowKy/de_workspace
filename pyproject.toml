[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "03_projects",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",  # Allow sys.path insertions prior to module imports for zero-JVM path resolution
    "E501",  # Relax hard line-length constraints for SQL strings and log formats
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
