name: Data Engineering CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DE_WORKSPACE_ROOT: ${{ github.workspace }}
  DATA_LAKE_PATH: "${{ github.workspace }}/.data_scratch/processed/parquet"
  TF_VAR_environment: "ci"
  TF_VAR_aws_region: "us-east-1"

jobs:
  code-quality-and-warehouse:
    name: Code Quality & Warehouse Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install uv & Set Up Python 3.12
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Locked Dependencies
        run: uv sync --no-install-project

      - name: Run Ruff Linter
        run: uv run --no-project ruff check .

      - name: Run SQLFluff Checks
        run: uv run --no-project sqlfluff lint 03_projects/02_elt_duckdb_dbt/models/ --dialect duckdb || true

      - name: Pre-Generate Data Lake Parquet Files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-project python3 03_projects/05_realtime_lakehouse/realtime_lakehouse.py

      - name: Build & Test dbt Models
        run: |
          mkdir -p ~/.dbt
          cat << 'PROFILE' > ~/.dbt/profiles.yml
          analytics_warehouse:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: "/tmp/analytics_lakehouse.duckdb"
                threads: 4
          PROFILE
          
          cd 03_projects/02_elt_duckdb_dbt
          uv run --no-project dbt run --profiles-dir ~/.dbt
          uv run --no-project dbt test --profiles-dir ~/.dbt

      - name: Execute Dagster Software-Defined Asset Orchestration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd 03_projects/06_dagster_orchestration
          uv run --no-project dagster asset materialize --select "*" -f repository.py

  terraform-infrastructure:
    name: Validate Infrastructure as Code
    runs-on: ubuntu-latest
    needs: code-quality-and-warehouse

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Initialize & Validate Terraform Code
        run: |
          cd 03_projects/03_devops_terraform_cicd
          terraform init -backend=false
          terraform validate
