name: Medallion Lakehouse CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pydantic deltalake pyarrow duckdb dagster dbt-duckdb fastapi uvicorn streamlit

      - name: Run Ruff Code Quality Linter
        run: ruff check .

      - name: Run Contract & Integration Tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -v -W error
